init_config:

instances:
  - name: profile-minio-live
    url: http://profile-minio:9000/minio/health/live
    timeout: 3
    tags:
      - env:prod
      - service:profile-minio

  # Translation subsystem health, served by the backend itself (the
  # LibreTranslate container this used to probe no longer exists — the
  # provider is an LLM behind the translation BC). The endpoint is cached
  # for an hour and never reaches the provider, so polling it is free.
  # Port mirrors `BACKEND_PORT`'s default in docker-compose.yml.
  - name: profile-backend-translation-health
    url: http://profile-backend:3001/api/v1/translation/health
    timeout: 5
    tags:
      - env:prod
      - service:profile-services
      - check:translation-health
