services:
  minio:
    # P1-#A6-7: pin tag — MinIO has had breaking changes between
    # `RELEASE.*` tags. Override via `MINIO_VERSION` for upgrades.
    image: minio/minio:${MINIO_VERSION:-RELEASE.2024-10-13T13-34-11Z}
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY:-minioadmin}
    labels:
      com.datadoghq.tags.env: ${DD_ENV:-prod}
      com.datadoghq.tags.service: profile-minio
      com.datadoghq.tags.version: ${MINIO_VERSION:-latest}
      com.datadoghq.ad.logs: '[{"source":"minio","service":"profile-minio"}]'
      com.datadoghq.ad.checks: >-
        {"http_check":{"init_config":{},"instances":[{"name":"profile-minio-live","url":"http://%%host%%:9000/minio/health/live","timeout":3}]}}
    ports:
      - "${MINIO_PORT:-9000}:9000"
      - "${MINIO_CONSOLE_PORT:-9001}:9001"
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 5
