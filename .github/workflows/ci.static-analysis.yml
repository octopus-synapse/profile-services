name: _static-analysis

on:
  workflow_call:

jobs:
  test:
    uses: octopus-synapse/octopus-workflows/.github/workflows/_static-analysis-template.yml@v1
    with:
      # The shared workflow does not generate Prisma Client. The descriptor
      # audit imports enum-backed route modules, so generate it first.
      test-command: "bunx prisma generate --config ./prisma.config.ts && bun test --config=config/bunfig.static-analysis.toml"
      test-name: "Static analysis"
      timeout: 10
    secrets: inherit
